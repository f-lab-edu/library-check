<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Vulnerability Scanner</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        
        .upload-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9fa;
        }
        
        .drop-zone:hover {
            border-color: #764ba2;
            background: #e9ecef;
        }
        
        .drop-zone.dragover {
            border-color: #28a745;
            background: #d4edda;
        }
        
        .drop-zone i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .file-info {
            background: #e7f3ff;
            border-left: 4px solid #0d6efd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .progress {
            height: 30px;
            border-radius: 15px;
        }
        
        .alert {
            border-radius: 10px;
        }
        
        .header-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .header-icon i {
            font-size: 2rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-container mx-auto">
            <!-- 헤더 -->
            <div class="text-center mb-4">
                <div class="header-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h2 class="fw-bold mb-2">Package Vulnerability Scanner</h2>
                <p class="text-muted">Upload your package.json to scan for security vulnerabilities</p>
            </div>

            <!-- 드래그 앤 드롭 영역 -->
            <div id="dropZone" class="drop-zone">
                <i class="bi bi-cloud-upload"></i>
                <h5 class="mb-2">Drag & Drop your package.json here</h5>
                <p class="text-muted mb-3">or</p>
                <input type="file" id="fileInput" accept=".json,application/json" class="d-none">
                <button type="button" class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-folder2-open me-2"></i>Browse Files
                </button>
                <p class="text-muted mt-3 mb-0"><small>Only .json files are accepted (Max 5MB)</small></p>
            </div>

            <!-- 선택된 파일 정보 -->
            <div id="fileInfo" class="file-info d-none">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-file-earmark-code me-2"></i>
                        <strong id="fileName">package.json</strong>
                        <span class="text-muted ms-2" id="fileSize"></span>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearFile()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>

            <!-- 업로드 버튼 -->
            <div class="text-center mt-4">
                <button id="uploadBtn" class="btn btn-primary btn-upload" onclick="uploadFile()" disabled>
                    <i class="bi bi-upload me-2"></i>Start Scan
                </button>
            </div>

            <!-- 진행 상황 -->
            <div id="progressContainer" class="mt-4 d-none">
                <div class="progress">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                         role="progressbar" style="width: 0%">0%</div>
                </div>
            </div>

            <!-- 알림 메시지 -->
            <div id="alertContainer" class="mt-4"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_URL = 'http://localhost:3000';
        let selectedFile = null;

        // DOM 요소
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const alertContainer = document.getElementById('alertContainer');

        // 파일 입력 이벤트
        fileInput.addEventListener('change', handleFileSelect);

        // 드래그 앤 드롭 이벤트
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // 파일 선택 처리
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        // 파일 검증 및 표시
        function handleFile(file) {
            // 파일 타입 검증
            if (!file.name.endsWith('.json')) {
                showAlert('danger', 'Please upload a valid JSON file.');
                return;
            }

            // 파일 크기 검증 (5MB)
            if (file.size > 5 * 1024 * 1024) {
                showAlert('danger', 'File size exceeds 5MB limit.');
                return;
            }

            selectedFile = file;
            
            // 파일 정보 표시
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.remove('d-none');
            uploadBtn.disabled = false;
            
            // 알림 제거
            alertContainer.innerHTML = '';
        }

        // 파일 제거
        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.add('d-none');
            uploadBtn.disabled = true;
            progressContainer.classList.add('d-none');
            alertContainer.innerHTML = '';
        }

        // 파일 업로드
        async function uploadFile() {
            if (!selectedFile) {
                showAlert('warning', 'Please select a file first.');
                return;
            }

            // UI 업데이트
            uploadBtn.disabled = true;
            progressContainer.classList.remove('d-none');
            alertContainer.innerHTML = '';
            updateProgress(0);

            // FormData 생성
            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // 진행 상황 시뮬레이션
                updateProgress(30);

                // API 호출
                const response = await fetch(`${API_URL}/project/scan`, {
                    method: 'POST',
                    body: formData,
                });

                updateProgress(70);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Upload failed');
                }

                const result = await response.json();
                updateProgress(100);

                // 성공 메시지
                setTimeout(() => {
                    showAlert('success', `
                        <strong>Upload Successful!</strong><br>
                        Project ID: ${result.projectId}<br>
                        ${result.message}<br>
                        <small class="text-muted">The vulnerability scan is running in the background.</small>
                    `);
                    
                    // 폼 초기화
                    setTimeout(() => {
                        clearFile();
                    }, 3000);
                }, 500);

            } catch (error) {
                console.error('Upload error:', error);
                showAlert('danger', `
                    <strong>Upload Failed!</strong><br>
                    ${error.message}
                `);
                uploadBtn.disabled = false;
            }
        }

        // 진행 상황 업데이트
        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
            
            if (percent === 100) {
                progressBar.classList.remove('progress-bar-animated');
            }
        }

        // 알림 표시
        function showAlert(type, message) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // 파일 크기 포맷
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
